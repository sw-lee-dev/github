server:
  # 기본 8090. 실행 시 SERVER_PORT 환경변수로 변경 가능
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: food-cost-approval
  jackson:
    deserialization:
      # 정수 항목(입수 EA, 생산수량 등)에 2.5 같은 소수가 오면 잘라내지 않고 400 으로 거부
      accept-float-as-int: false
  datasource:
    url: jdbc:h2:mem:foodcost;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

app:
  jwt:
    # 운영 환경에서는 반드시 환경변수(APP_JWT_SECRET)로 교체하세요. 32바이트 이상.
    secret: ${APP_JWT_SECRET:food-cost-approval-local-dev-secret-key-change-me}
    expiration-minutes: 480
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
  seed-data: true

logging:
  level:
    com.foodcost: debug
